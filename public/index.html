<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamAct | AI Motion Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface: #1a1f2e;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.15), transparent 40%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            flex-grow: 1;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .upload-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .upload-box {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            color: #4b5563;
        }

        .upload-box.video-box {
            background: linear-gradient(135deg, #c3cfb8, #e0e0e0);
        }

        .upload-box.image-box {
            background: linear-gradient(135deg, #b8bcc0, #cfcfcf);
        }

        .upload-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .upload-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        .upload-icon {
            font-size: 32px;
            margin-bottom: 15px;
            z-index: 2;
        }

        .upload-text {
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            z-index: 2;
            color: #374151;
            line-height: 1.4;
        }

        .plus-sign {
            font-size: 24px;
            color: #6b7280;
            font-weight: 400;
        }

        .preview-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 5;
            display: none;
        }

        .glass-panel {
            background: rgba(26, 31, 46, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* ... existing button and loader styles ... */
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 30px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--primary);
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-area { margin-top: 40px; display: none; text-align: center; }
        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; display: none; }
        .loader { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: var(--accent); animation: spin 1s ease-in-out infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-text { color: var(--primary); font-weight: 600; font-size: 1.1rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #finalVideo { width: 100%; max-width: 600px; border-radius: 16px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.7); margin-top: 20px; border: 2px solid var(--border); background: #000; }
        .error-msg { color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 15px; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.2); margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>DreamAct Motion Control</h1>
            <p class="subtitle">Animate any character image with a driving reference video.</p>
        </header>

        <div class="glass-panel">
            <form id="dreamForm">
                
                <div class="upload-section">
                    <!-- Video Upload Box -->
                    <div class="upload-box video-box">
                        <input type="file" id="videoFile" accept="video/mp4,video/mov,video/quicktime" required>
                        <svg class="upload-icon" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m-3-3h6"></path></svg>
                        <div class="upload-text">Reference<br>Video</div>
                        <video id="vidPreview" class="preview-media" muted loop autoplay playsinline></video>
                    </div>

                    <div class="plus-sign">+</div>

                    <!-- Image Upload Box -->
                    <div class="upload-box image-box">
                        <input type="file" id="imageFile" accept="image/jpeg,image/png,image/webp" required>
                        <svg class="upload-icon" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline><path d="M14 14v6m-3-3h6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        <div class="upload-text">Character<br>Image</div>
                        <img id="imgPreview" class="preview-media" alt="Character">
                    </div>
                </div>

                <button type="submit" class="btn" id="generateBtn">Generate Animation</button>
            </form>

            <div class="error-msg" id="errorMsg"></div>

            <div class="loader-container" id="loaderContainer">
                <div class="loader"></div>
                <div class="status-text" id="statusText">Uploading files...</div>
            </div>

            <div class="result-area" id="resultArea">
                <h3 style="color: var(--success); margin-bottom: 15px;">✨ Animation Complete!</h3>
                <video id="finalVideo" controls></video>
                <div style="margin-top: 15px;">
                    <a id="downloadLink" class="btn" style="display: inline-block; width: auto; padding: 10px 25px; text-decoration: none;" download>Download Video</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('dreamForm');
        const generateBtn = document.getElementById('generateBtn');
        const loaderContainer = document.getElementById('loaderContainer');
        const resultArea = document.getElementById('resultArea');
        const finalVideo = document.getElementById('finalVideo');
        const statusText = document.getElementById('statusText');
        const errorMsg = document.getElementById('errorMsg');
        const downloadLink = document.getElementById('downloadLink');

        // File Inputs & Previews
        const videoFileInput = document.getElementById('videoFile');
        const imageFileInput = document.getElementById('imageFile');
        const vidPreview = document.getElementById('vidPreview');
        const imgPreview = document.getElementById('imgPreview');

        videoFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                vidPreview.src = url;
                vidPreview.style.display = 'block';
            }
        });

        imageFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                imgPreview.src = url;
                imgPreview.style.display = 'block';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            errorMsg.style.display = 'none';
            resultArea.style.display = 'none';
            loaderContainer.style.display = 'flex';
            generateBtn.disabled = true;
            statusText.innerText = "Uploading files to server...";

            try {
                const formData = new FormData();
                formData.append('videoFile', videoFileInput.files[0]);
                formData.append('imageFile', imageFileInput.files[0]);

                const response = await fetch('/api/dreamact', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to start task');
                }

                const taskId = data.taskId;
                console.log(`Task started: ${taskId} using key ${data.usedKey}`);

                // Polling Status
                await pollTask(taskId);

            } catch (err) {
                showError(err.message);
            }
        });

        async function pollTask(taskId) {
            const maxAttempts = 120; // 5 minutes max (if polling every 2.5s)
            let attempts = 0;

            const interval = setInterval(async () => {
                attempts++;
                statusText.innerText = `Generating AI Animation... (Attempt ${attempts})`;

                try {
                    const res = await fetch(`/api/task/${taskId}`);
                    const data = await res.json();
                    
                    // Task status mapping: 1=Pending, 2=Running, 3=Success, 4=Failed
                    const taskInfo = data.task || data;
                    
                    if (taskInfo.status === 3) {
                        clearInterval(interval);
                        
                        // Try to find the output video URL. Usually in data.videos[0].videoUrl
                        let outputUrl = null;
                        if (data.videos && data.videos.length > 0) {
                            outputUrl = data.videos[0].videoUrl;
                        } else if (data.task && data.task.resultUrl) {
                            outputUrl = data.task.resultUrl;
                        } else {
                            // Fallback stringify search
                            const str = JSON.stringify(data);
                            const match = str.match(/https:\/\/[^"']+\.mp4/);
                            if (match) outputUrl = match[0];
                        }

                        if (outputUrl) {
                            showResult(outputUrl);
                        } else {
                            showError("Task succeeded but output video URL not found in response.");
                        }
                    } else if (taskInfo.status === 4 || taskInfo.status < 0) {
                        clearInterval(interval);
                        showError("Task failed during generation: " + (taskInfo.reason || 'Unknown error'));
                    } else if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        showError("Task timed out. It might still be processing.");
                    }
                } catch (e) {
                    console.error("Polling error", e);
                    // keep trying until maxAttempts
                }

            }, 2500);
        }

        function showResult(url) {
            loaderContainer.style.display = 'none';
            generateBtn.disabled = false;
            
            finalVideo.src = url;
            downloadLink.href = url;
            resultArea.style.display = 'block';
        }

        function showError(msg) {
            loaderContainer.style.display = 'none';
            generateBtn.disabled = false;
            
            errorMsg.innerText = "⚠️ " + msg;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
